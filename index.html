<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Block Dodge</title><style>*{box-sizing:border-box}body{margin:0;background:#080f20;color:#f1f5f9;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:22px}main{width:min(100%,440px);background:#172238;border:1px solid #2b3952;border-radius:20px;padding:20px}h1{font-size:34px;margin:5px 0}small{color:#5eead4;letter-spacing:3px}p{color:#bac8df;line-height:1.5}canvas{display:block;width:100%;border-radius:12px;border:1px solid #334155}.stage{position:relative}.overlay{position:absolute;inset:0;background:#080f20e8;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}.overlay h2{font-size:32px;margin:0}.overlay p{max-width:260px}.controls{display:flex;gap:12px;margin-top:16px}button{border:1px solid #52647f;border-radius:10px;background:#293b56;color:white;padding:14px 22px;font-size:16px;font-weight:bold;cursor:pointer;touch-action:none;user-select:none}button:hover{filter:brightness(1.18)}button:focus-visible{outline:3px solid #5eead4;outline-offset:3px}.controls button{flex:1}.start{background:#5eead4;color:#102b2a;border:0}.stats{display:flex;justify-content:space-between;margin:20px 0 12px}.help{font-size:12px;margin-bottom:0}[hidden]{display:none!important}</style></head><body><div id="root"><main><h1>Block Dodge</h1><p>Loading the game…</p></main></div><script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script><script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script><script>
function BlockDodge(){const ref=React.useRef(null);React.useEffect(()=>{const host=ref.current;host.innerHTML=`<small>THE QUICK REFLEX CHALLENGE</small><h1>Block Dodge</h1><p>Small square. Big survival energy.</p><div class="stats"><strong id="score">Score: 0</strong><span id="best">Best: 0</span></div><div class="stage"><canvas width="400" height="500" aria-label="Dodge falling pink blocks with the green player"></canvas><div class="overlay"><h2 id="title">Ready to dodge?</h2><p id="result">Move left and right. Avoid the pink blocks. Every block you dodge earns a point.</p><button class="start">Start Game</button></div></div><div class="controls"><button id="left" aria-label="Move left">← Left</button><button id="right" aria-label="Move right">Right →</button></div><p class="help">Use ← → or A / D, or hold the buttons. Press P to pause.</p><p id="live" aria-live="polite" class="help"></p>`;const find=s=>host.querySelector(s),canvas=find('canvas'),ctx=canvas.getContext('2d'),overlay=find('.overlay'),keys={left:false,right:false};let x=185,blocks=[],score=0,best=0,timer=0,running=false,paused=false,last=null,raf;try{best=Number(localStorage.getItem('blockDodgeBest'))||0}catch{}find('#best').textContent='Best: '+best;
function start(){x=185;blocks=[];score=0;timer=0;keys.left=keys.right=false;running=true;paused=false;find('#score').textContent='Score: 0';overlay.hidden=true;find('#live').textContent='Game started.';canvas.focus()}
function finish(){running=false;keys.left=keys.right=false;best=Math.max(best,score);try{localStorage.setItem('blockDodgeBest',best)}catch{}find('#best').textContent='Best: '+best;find('#title').textContent='Game over!';find('#result').textContent='You dodged '+score+' blocks. Can you beat your best?';find('.start').textContent='Play Again';overlay.hidden=false;find('#live').textContent='Game over. Score '+score}
function pause(){if(!running)return;paused=!paused;overlay.hidden=!paused;find('#title').textContent='Take a breath';find('#result').textContent='Your game is paused.';find('.start').textContent='Resume';find('#live').textContent=paused?'Paused.':'Resumed.'}
function key(e,down){const k=e.key.toLowerCase();if(['arrowleft','arrowright','a','d'].includes(k)){e.preventDefault();if(k==='arrowleft'||k==='a')keys.left=down;else keys.right=down}if(k==='p'&&down&&!e.repeat)pause()}
const kd=e=>key(e,true),ku=e=>key(e,false),release=()=>{keys.left=keys.right=false},blur=()=>{release();if(running&&!paused)pause()};window.addEventListener('keydown',kd);window.addEventListener('keyup',ku);window.addEventListener('blur',blur);window.addEventListener('pointerup',release);window.addEventListener('pointercancel',release);find('.start').onclick=()=>{if(running&&paused)pause();else start()};for(const dir of ['left','right']){const b=find('#'+dir);b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);if(running&&!paused)keys[dir]=true};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>keys[dir]=false}
function frame(t){const dt=last===null?0:Math.min((t-last)/1000,.04);last=t;if(running&&!paused){x=Math.max(0,Math.min(370,x+(Number(keys.right)-Number(keys.left))*320*dt));timer+=dt;const rate=Math.max(.27,.8-score*.012);while(timer>=rate){timer-=rate;blocks.push({x:Math.random()*370,y:-30})}for(const b of blocks){b.y+=Math.min(380,170+score*4)*dt;if(x<b.x+30&&x+30>b.x&&440<b.y+30&&470>b.y){finish();break}}if(running){const remaining=blocks.filter(b=>b.y<500);score+=blocks.length-remaining.length;blocks=remaining;find('#score').textContent='Score: '+score}}ctx.fillStyle='#101b32';ctx.fillRect(0,0,400,500);ctx.strokeStyle='#1e2c46';ctx.lineWidth=1;for(let i=0;i<=500;i+=40){ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(400,i);ctx.stroke();if(i<=400){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,500);ctx.stroke()}}for(const b of blocks){ctx.fillStyle='#fb7185';ctx.fillRect(b.x,b.y,30,30);ctx.fillStyle='#fecdd3';ctx.fillRect(b.x+5,b.y+5,8,4)}ctx.fillStyle='#5eead4';ctx.fillRect(x,440,30,30);ctx.fillStyle='#134e4a';ctx.fillRect(x+6,448,5,5);ctx.fillRect(x+19,448,5,5);raf=requestAnimationFrame(frame)}raf=requestAnimationFrame(frame);return()=>{cancelAnimationFrame(raf);window.removeEventListener('keydown',kd);window.removeEventListener('keyup',ku);window.removeEventListener('blur',blur);window.removeEventListener('pointerup',release);window.removeEventListener('pointercancel',release)}},[]);return React.createElement('main',{ref})}
if(window.React&&window.ReactDOM){ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(BlockDodge))}else{document.getElementById('root').innerHTML='<main><h1>Connection needed</h1><p>Please reconnect to the internet and reload to load React and start the game.</p></main>'}
</script></body></html>
